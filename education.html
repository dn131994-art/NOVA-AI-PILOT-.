<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Education AI | Nova AI Pilot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
color:white;
background:radial-gradient(circle at top,#142b55,#050816 65%);
padding:30px 20px;
}

.container{
max-width:900px;
margin:auto;
}

.back{
display:inline-block;
color:#00e5ff;
text-decoration:none;
margin-bottom:40px;
font-size:18px;
}

h1{
text-align:center;
font-size:48px;
color:#00e5ff;
text-shadow:0 0 25px #00e5ff;
margin-bottom:15px;
}

.subtitle{
text-align:center;
color:#ddd;
font-size:19px;
margin-bottom:40px;
}

.panel{
background:rgba(255,255,255,.07);
border:1px solid rgba(0,229,255,.25);
border-radius:25px;
padding:30px;
backdrop-filter:blur(15px);
box-shadow:0 0 35px rgba(0,229,255,.12);
}

label{
display:block;
margin-bottom:10px;
color:#00e5ff;
font-weight:bold;
}

input,select{
width:100%;
padding:15px;
margin-bottom:20px;
border-radius:12px;
border:1px solid #24506b;
background:#071226;
color:white;
font-size:16px;
outline:none;
}

button{
padding:15px 35px;
border:0;
border-radius:40px;
background:linear-gradient(45deg,#00e5ff,#7b2cff);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px rgba(0,229,255,.5);
}

button:hover{
transform:scale(1.05);
}

.result{
margin-top:30px;
padding:20px;
border-radius:18px;
background:rgba(0,229,255,.06);
border:1px solid rgba(0,229,255,.15);
color:#ddd;
line-height:1.7;
}

@media(max-width:600px){
h1{
font-size:36px;
}

.panel{
padding:20px;
}
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← Back to Nova AI Pilot</a>

<h1>📚 Education AI</h1>

<p class="subtitle">
Your personal AI learning companion.
</p>

<div class="panel">

<label>What do you want to learn?</label>

<input
id="topic"
type="text"
placeholder="Example: HTML, Mathematics, English..."
>

<label>Your learning level</label>

<select id="level">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
</select>

<button onclick="createPlan()">
Create Learning Plan 🚀
</button>

<div class="result" id="result">
Your personalized learning plan will appear here.
</div>

</div>

</div>

<script>

function createPlan(){

const topic=document.getElementById("topic").value;
const level=document.getElementById("level").value;
const result=document.getElementById("result");

if(topic.trim()===""){
result.innerHTML="⚠️ Please enter a subject you want to learn.";
return;
}

result.innerHTML=
"🧠 <b>Nova AI Learning Plan</b><br><br>"+
"📚 Subject: "+topic+"<br>"+
"🎯 Level: "+level+"<br><br>"+
"1️⃣ Understand the fundamentals<br>"+
"2️⃣ Practice with simple examples<br>"+
"3️⃣ Complete practical exercises<br>"+
"4️⃣ Test your knowledge<br>"+
"5️⃣ Build a real project<br><br>"+
"🚀 Your learning journey starts now.";

}

</script>

</body>
</html>
