<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business AI | Nova AI Pilot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
color:white;
background:
radial-gradient(circle at top,#142b55,#050816 65%);
padding:30px 20px;
}

.container{
max-width:900px;
margin:auto;
}

.back{
display:inline-block;
color:#00e5ff;
text-decoration:none;
margin-bottom:40px;
font-size:18px;
}

h1{
text-align:center;
font-size:48px;
color:#00e5ff;
text-shadow:0 0 25px #00e5ff;
margin-bottom:15px;
}

.subtitle{
text-align:center;
color:#ddd;
font-size:19px;
margin-bottom:40px;
}

.panel{
background:rgba(255,255,255,.07);
border:1px solid rgba(0,229,255,.25);
border-radius:25px;
padding:30px;
backdrop-filter:blur(15px);
box-shadow:0 0 35px rgba(0,229,255,.12);
}

label{
display:block;
margin-bottom:10px;
color:#00e5ff;
font-weight:bold;
}

textarea{
width:100%;
height:150px;
resize:none;
padding:18px;
border-radius:15px;
border:1px solid #24506b;
background:#071226;
color:white;
font-size:16px;
outline:none;
}

button{
margin-top:20px;
padding:15px 35px;
border:0;
border-radius:40px;
background:linear-gradient(45deg,#00e5ff,#7b2cff);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px rgba(0,229,255,.5);
}

button:hover{
transform:scale(1.05);
}

.result{
margin-top:30px;
padding:20px;
border-radius:18px;
background:rgba(0,229,255,.06);
border:1px solid rgba(0,229,255,.15);
color:#ddd;
line-height:1.7;
}

@media(max-width:600px){
h1{
font-size:36px;
}

.panel{
padding:20px;
}
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← Back to Nova AI Pilot</a>

<h1>🤖 Business AI</h1>

<p class="subtitle">
Your AI co-pilot for business growth and strategy.
</p>

<div class="panel">

<label>Tell us about your business</label>

<textarea id="businessInput"
placeholder="Example: I run a clothing business and want to increase sales..."></textarea>

<button onclick="analyzeBusiness()">
Analyze Business 🚀
</button>

<div class="result" id="result">
Your AI business analysis will appear here.
</div>

</div>

</div>

<script>
function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,function(ch){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch];
 });
}
function analyzeBusiness(){
 const input=document.getElementById("businessInput").value.trim();
 const result=document.getElementById("result");
 if(!input){
  result.textContent="⚠️ Please enter some information about your business.";
  return;
 }
 const safe=escapeHTML(input);
 result.innerHTML=
  "<h3 style='color:#00e5ff;margin-bottom:12px;'>🧠 Nova Business Growth Starter Plan</h3>"+
  "<p><b>Your business:</b> "+safe+"</p>"+
  "<p style='margin-top:14px;color:#55ffb0;'><b>Mode:</b> Demo planner — live AI is not connected yet.</p>"+
  "<div style='margin-top:18px;line-height:1.9;'>"+
  "<b>1. Know your customer</b><br>Write down who is most likely to buy, what they need and where they discover products.<br><br>"+
  "<b>2. Improve your offer</b><br>Choose your best-selling product or service. Explain its main benefit clearly and make pricing easy to understand.<br><br>"+
  "<b>3. Get more customers</b><br>Share useful photos, customer reviews and clear contact details on the channels your customers already use.<br><br>"+
  "<b>4. Track the numbers</b><br>Record weekly enquiries, orders, total sales and expenses. Repeat what brings profitable customers.<br><br>"+
  "<b>5. Take one action this week</b><br>Talk to five existing or potential customers and ask what would make them choose your business."+
  "</div>"+
  "<p style='margin-top:18px;color:#00e5ff;'><b>Next step:</b> Add your customer type, location and monthly sales target to make this starter plan more specific.</p>";
}
</script>

</body>
</html>
