<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Innovation Lab | Nova AI Pilot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
color:white;
background:
radial-gradient(circle at top,#21145c,#050816 65%);
padding:30px 20px;
}

.container{
max-width:950px;
margin:auto;
}

.back{
display:inline-block;
color:#00e5ff;
text-decoration:none;
margin-bottom:40px;
font-size:18px;
}

h1{
text-align:center;
font-size:48px;
color:#00e5ff;
text-shadow:0 0 25px #00e5ff;
margin-bottom:15px;
}

.subtitle{
text-align:center;
color:#ddd;
font-size:19px;
margin-bottom:40px;
}

.panel{
background:rgba(255,255,255,.07);
border:1px solid rgba(0,229,255,.25);
border-radius:25px;
padding:30px;
backdrop-filter:blur(15px);
box-shadow:0 0 35px rgba(0,229,255,.12);
}

label{
display:block;
margin-bottom:10px;
color:#00e5ff;
font-weight:bold;
}

input,textarea,select{
width:100%;
padding:15px;
margin-bottom:20px;
border-radius:12px;
border:1px solid #24506b;
background:#071226;
color:white;
font-size:16px;
outline:none;
}

textarea{
height:130px;
resize:none;
}

button{
padding:15px 35px;
border:0;
border-radius:40px;
background:linear-gradient(45deg,#00e5ff,#7b2cff);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px rgba(0,229,255,.5);
}

button:hover{
transform:scale(1.05);
}

.result{
margin-top:30px;
padding:25px;
border-radius:18px;
background:rgba(0,229,255,.06);
border:1px solid rgba(0,229,255,.15);
color:#ddd;
line-height:1.8;
}

.idea{
margin-top:15px;
padding:15px;
border-left:3px solid #00e5ff;
background:rgba(255,255,255,.04);
border-radius:8px;
}

@media(max-width:600px){

h1{
font-size:36px;
}

.panel{
padding:20px;
}

button{
width:100%;
}

}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← Back to Nova AI Pilot</a>

<h1>💡 Innovation Lab</h1>

<p class="subtitle">
Turn your ideas into future possibilities with AI.
</p>

<div class="panel">

<label>Your Innovation Idea</label>

<textarea
id="idea"
placeholder="Example: I want to create an AI app that helps small businesses..."
></textarea>

<label>Innovation Category</label>

<select id="category">

<option>Artificial Intelligence</option>
<option>Business</option>
<option>Education</option>
<option>Technology</option>
<option>Healthcare</option>
<option>Environment</option>
<option>Other</option>

</select>

<button onclick="generateIdea()">
Develop My Idea 🚀
</button>

<div class="result" id="result">

Your innovation roadmap will appear here.

</div>

</div>

</div>

<script>

function generateIdea(){

const idea=document.getElementById("idea").value;
const category=document.getElementById("category").value;
const result=document.getElementById("result");

if(idea.trim()===""){

result.innerHTML=
"⚠️ Please enter your idea first.";

return;

}

result.innerHTML=

"🧠 <b>Nova AI Innovation Analysis</b><br><br>"+

"💡 <b>Your Idea:</b> "+
idea+"<br><br>"+

"🔬 <b>Category:</b> "+
category+"<br><br>"+

"<div class='idea'>"+
"1️⃣ Define the problem you want to solve."
+"</div>"+

"<div class='idea'>"+
"2️⃣ Identify your target users."
+"</div>"+

"<div class='idea'>"+
"3️⃣ Build a simple prototype."
+"</div>"+

"<div class='idea'>"+
"4️⃣ Test the idea with real users."
+"</div>"+

"<div class='idea'>"+
"5️⃣ Improve the product using feedback."
+"</div>"+

"<br>🚀 <b>Next Goal:</b> Turn the concept into a working prototype.";

}

</script>

</body>
</html>
